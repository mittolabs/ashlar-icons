name: packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ashlar_icons
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Ready to publish
        run: dart pub publish --dry-run

  jaspr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ashlar_icons_jaspr
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.4"

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Ready to publish
        run: dart pub publish --dry-run

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Packs each package as npm would publish it, installs the tarballs into a fresh
      # app, and checks that React's types hold and that an icon renders.
      - name: Pack and try the packages
        run: |
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          for p in core react web; do npm pack --silent --pack-destination . "$GITHUB_WORKSPACE/packages/$p"; done
          # React depends on core by version, which the registry may not have yet: point it at the tarball.
          v=$(node -p "require('$GITHUB_WORKSPACE/packages/core/package.json').version")
          cat > package.json <<JSON
          { "name": "try", "private": true, "type": "module",
            "dependencies": {
              "@mittolabs/ashlar-icons-core": "file:./mittolabs-ashlar-icons-core-$v.tgz",
              "@mittolabs/ashlar-icons-react": "file:./mittolabs-ashlar-icons-react-$v.tgz",
              "@mittolabs/ashlar-icons": "file:./mittolabs-ashlar-icons-$v.tgz" },
            "overrides": { "@mittolabs/ashlar-icons-core": "\$@mittolabs/ashlar-icons-core" } }
          JSON
          npm install
          npm install react@19 react-dom@19 @types/react@19 @types/react-dom@19 typescript@5
          cat > try.tsx <<'TSX'
          import { renderToStaticMarkup } from 'react-dom/server';
          import { AshlarIcon, CalendarIcon } from '@mittolabs/ashlar-icons-react';
          import { CalendarIcon as Duo } from '@mittolabs/ashlar-icons-react/rounded-duotone';
          const html = renderToStaticMarkup(<p><AshlarIcon icon={CalendarIcon} className="size-4" /><AshlarIcon icon={Duo} secondaryColor="#c7d2fe" /></p>);
          if (!html.includes('<path d="M') || !html.includes('fill:#c7d2fe') || !html.includes('ashlar-icon-calendar')) throw new Error(html);
          console.log('renders');
          TSX
          npx tsc --strict --jsx react-jsx --module nodenext --moduleResolution nodenext --target es2022 --outDir out try.tsx
          node out/try.js
          test -f node_modules/@mittolabs/ashlar-icons/svg/rounded-stroke/calendar.svg
